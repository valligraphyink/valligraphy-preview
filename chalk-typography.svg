<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Chalkboard typography signage</title><desc id="desc">A warm, elegant chalkboard sign with the word Chalk in white hand-lettered script.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171512"/><stop offset=".55" stop-color="#3b3027"/><stop offset="1" stop-color="#171512"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#c9a574"/><stop offset=".5" stop-color="#80603c"/><stop offset="1" stop-color="#d2b184"/></linearGradient>
 <linearGradient id="board" x2="1" y2="1"><stop stop-color="#252321"/><stop offset="1" stop-color="#090909"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
 <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M0 12h44M0 31h44" stroke="#fff" opacity=".025" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/><rect width="1200" height="680" fill="url(#grain)"/>
<circle cx="92" cy="90" r="130" fill="#a8885f" opacity=".12" filter="url(#shadow)"/>
<g fill="none" stroke="#b49a6b" opacity=".55" stroke-width="3"><path d="M80 520q60-90 110-5t100-10"/><path d="M104 500q-30-60-62-65m90 63q-5-60 35-86m-9 97q50-40 80-25"/></g>
<text x="72" y="205" fill="#d2ad72" font-family="Georgia,serif" font-size="76" font-style="italic">Typography</text>
<path d="M78 236h430" stroke="#b08b56" stroke-width="2"/>
<text x="80" y="315" fill="#f5efe6" font-family="Georgia,serif" font-size="31">Keep customers informed</text>
<text x="80" y="360" fill="#f5efe6" font-family="Georgia,serif" font-size="31">with aesthetic chalkboard</text>
<text x="80" y="405" fill="#f5efe6" font-family="Georgia,serif" font-size="31">signage for your business</text>
<path d="M80 458h350" stroke="#b08b56" stroke-width="2"/><path d="M255 448l12 12-12 12-12-12z" fill="none" stroke="#b08b56" stroke-width="2"/>
<g transform="translate(585 68) rotate(2 260 260)">
 <rect x="10" y="18" width="530" height="520" rx="8" fill="#000" opacity=".55" filter="url(#shadow)"/>
 <rect x="0" y="0" width="530" height="520" rx="7" fill="url(#wood)"/>
 <rect x="19" y="19" width="492" height="482" rx="3" fill="#4a3826"/>
 <rect x="35" y="35" width="460" height="450" fill="url(#board)" stroke="#d5b98d" stroke-width="2"/>
 <rect x="35" y="35" width="460" height="450" fill="url(#grain)"/>
 <text x="265" y="245" text-anchor="middle" fill="#f1eee8" font-family="Georgia,serif" font-size="104" font-style="italic">Chalk</text>
 <path d="M110 285q155 75 310 0M150 315q115 44 230 0" fill="none" stroke="#eeeae2" stroke-width="5" stroke-linecap="round" opacity=".9"/>
 <path d="M92 110q30-30 60 0t60 0m170 0q30-30 60 0t60 0" fill="none" stroke="#eeeae2" stroke-width="3" opacity=".6"/>
 <text x="265" y="405" text-anchor="middle" fill="#d5b98d" font-family="Georgia,serif" font-size="24" letter-spacing="5">HAND LETTERED</text>
</g>
<g fill="#c6a775" opacity=".9"><circle cx="1120" cy="575" r="4"/><circle cx="1090" cy="600" r="3"/><circle cx="1150" cy="610" r="3"/></g>
</svg>